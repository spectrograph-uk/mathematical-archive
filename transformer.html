/* 

Regular expression routine to expand the string -E*dE  in terms of a matrix expression
by rotating cyclic words.

How it will work: We write this as trace(E^t dE), then replace the second occurrence of E 
with the concatenation, if the correct output is Y and there are m layers, we
replace both occurrences of E (being sure to start with a left parenthesis so the whole
expression is due to be transposed), with "(" then the concatenation for i=1 to m of the string

"(m( a( n_i^{-1/2} X_i Q_i K_i^t X_i^t ) X V_i +  C b_i) W_i  +C_f_i )"

and then ")"

I have used W and U for the linear transformations on both sides of activation m
and the translation vectors are b and f, note C is just a column of 1's so Cb_i and Cf_i are
representing rank one matricees.

As we know, a represents softmax of the rows and m sets negative entries to zero.

It will be easiest to get rid of all parenteheses after the letter d, so 
there we 'expand' the product of m sums as a sum of words.

Then we apply linearity of d to write it as a sum of d applied to words.

Then we use Leibniz rule to rewrite each d applied to a word as a sum of words with d applied
to one term. We may ignore terms where d is applied to a constant (the input matrix or its transpose).

We cyclically rotate each word, beginning now with E^t, so that it ends with a factor with d applied.
We are going to put our expression inside a trace (     )    string, but for now
we focus on rewriting it further.

For words where the term with d applied is a weight matrix or transpose we  move the transpose symbol
outside the d.

For words which end with da(  word )  or  dm(   word )  we now rewrite this as

aa(word) d word  or   mm( word, d word ).

We now expand d word in both cases as a sum using Leibniz rule, and using that mm commutes
with sums, each expression now becomes a sum. In aa(word) d word  the Leibniz expression
for d word will have some letters to the left of the d and these are concatenated with aa(word).
A new cyclic rotation brings the matrix with d applied to the end.

In mm(word, d word)  the terms that result will be mm applied to a word which may have matrices both before
and after the one with d applied.

We know that for any matrix X, we can write mm(word, X) as a sum of matrix words of the type AXB.
For example if we want to set all entries of X except the top left entry to zero we take A and B to be diagonal
matries with a 1 in the upper-left corner and the rest zero.

When we do this to a word which is already of the form QXR  we get a new of matrix words.

These can now be rotated to bring the weight matrix with d applied to the right.

This step is inefficient since the number of matrix words needed is equal to the number of nonnegative
entries of "word". Also if we perform this last step the sum has too many terms to be human readable.

So we will leave the expression with some words ending in  m(word, A dX B)  knowing we can't
rotate the B to the beginning until we've rewritten this as a sum of two-sided multiples
of A dX B.

For computational efficiency it is better to write the trace of the whole word in the form

trace(Y mm(word, A dX B))

and think of mm(word, A dX B) as a four-tensor.

We just multiply A dX B as if they were three matrices, with dX  a sum of tensor squares, 
one for each matrix entry of X. That is, as an array, dX has a 1 in each position 
of the form (i,j,i,j) and we may write it as a sum of tensor squares of matrices
with a single nonzero entry, sum E_{ij} \otimes E_{ij}.  If we write A as
the sum of a_{qi} E_{qi} and B as a sum of b_{js} E_{js} the triple product
is the sum over all q,s,i,j  of a_{qi}b_{js}E_{qs}\otimes E_{ij}  The operation of m
is to remove the terms for particular pairs (q,s) from the sum before we multiply
on the left by another matrix sum_{rq}y_{rq}E_{rq} The coefficient we're interested
in is where we fix i and j, so it is the sum of y_{rq}a_{qi}b_{js} with a fixed value
of i,j where we sum over q,r,s and were we remove terms for which particular pairs (q,s) 
are considered illegal (those where word_{ij}<0 when evaluated). So our
coefficient, for our fixed i,j is sum_{q,r,s} y_{rq}a_{qi}b_{js}  where
we remove terms corresponding to particular pair (q,s). The coefficient
in the trace is actually, come to think of it, the sum only under the
additional restriction that r=s. Then we could just make particular pairs (r,s)
illegal, in other words we could if we wished apply a  truncation to Y instead.
Then we *are* allowed to cyclically rotate the word to bring the differential to the end.

So, we have  the amazing formula

trace (Y mm(word, A dX B) = trace (mm(word^t), Y)  A dX B )

and now we can rewrite this as 

trace( B mm(word^t ,Y) A dX)

as needed !!!



So this is both human and machine readable, we just have to write down the regex

*/



function forms(i,j){

x=encoder(i);y=form(x);z=expandAll(y);w=expandmm(z);ww=flatten(w);wt=shiftmm(ww);wc=cycle(wt)
if(typeof(j)=="undefined"){show(html(wc))}else{show(html(wc[j]))}


}

var screen=""

function form(X){var  res2=["E^t"];res2.op="";res=[res2,d(X)];res.op=".";return res}


function flatten(x){



var y=expandAll(x)

if((y.op=="."||y.op=="+")&&y.length==1)return flatten(y[0])

if(y.op!="+")return y

var res=[]
for(var i=0;i<y.length;i++){
res=oplus(res,flatten(y[i]))

}
res.op="+"
return res
}



function flattenm(x){
if(x.op!=".")return x
var res=[]
for(var i=0;i<x.length;i++){
res=otimes(res,flattenm(x[i]))

}
res.op="."
return res
}






function html(s){
if(typeof(s)=="object")s=string(s)
s=s.replace(/(\[)([0-9])(\])/g, "<sub>$2</sub>")
s=s.replace(/\^t/g,"<sup>t</sup>")
s=s.replace(/\^\{\-1\/2\}/g,"<sup>-1/2</sup>")
s=s.replace(/([^am])(\()([^\(\)\+]*)(\))/g,"$1$3")


return s
}

Q=[],K=[],V=[],W=[],U=[],b=[],f=[]
var X=[],Y=[] 

// Y is correct output, X is input already position encoded.

//Q=queries, K=keys, V=values, W,b give first affine, U,f second.

function log(x){
error.style.color="#E0DD44"
error.value=x} 



function cycle(a){
var b=flatten(a)

if(b.op=="+"){var res=[];res.op="+";for(var i=0;i<b.length;i++){res[i]=cycle(b[i])}return res}

if(b.op!=".")return b




//find factor with operation "d"
for(var j=0;j<b.length;j++){if(b[j].op=="d")break}
if(j==b.length)return b

var res=b.slice(j+1).concat(b.slice(0,j+1))
res.op=b.op
return res

}



function encoder(l){

// here l is the number of encoding levels, and n is an array of length n+1 giving the dimension before&after each level.



 var result=[];result.op=""
 for(var i=0;i<l;i++){

 var attn=[];attn.op="."
 var ni=["n["+i.toString()+"]^{-1/2}"];ni.op="";
 attn.push(ni)
 var Xi=["X["+i.toString()+"]"];Xi.op="";
 attn.push(Xi)
 var Qi=["Q["+i.toString()+"]"];Qi.op=""
 attn.push(Qi)
var Kit=["K["+i.toString()+"]^t"];Kit.op=""
 attn.push(Kit)
var Xit=["X["+i.toString()+"]^t"];Xit.op=""
 attn.push(Xit)
var a=[attn];a.op="a";


var Vi=["V["+i.toString()+"]"];Vi.op=""
C=["C"];C.op=""
bi=["b["+i.toString()+"]"];bi.op=""
m=[oplus(    otimes(otimes(a,Xi),Vi)    ,  otimes(C,bi)    )]
m.op="m"
Wi=["W["+i.toString()+"]"];Wi.op=""
fi=["f["+i.toString()+"]"];fi.op=""

var E=oplus(otimes(m,Wi),otimes(C,fi))

result=otimes(E,result)


}



return result

}



function times(a,b){
var c=[]
for(var i=0;i<a.length;i++){c[i]=[]
for(var j=0;j<b[0].length;j++){var t=0;
for(var k=0;k<a[i].length;k++){t=t+a[i][k]*b[k][j]}
c[i][j]=t
}}
return c
}


function plus(a,b){
var c=[]
for(var i=0;i<a.length;i++){c[i]=[]
for(var j=0;j<a[i].length;j++){c[i][j]=a[i][j]+b[i][j]}
}
return c
}

function m(x){
var c=[]
for(var i=0;i<x.length;i++){c[i]=[]
for(var j=0;j<x[i].length;j++){if(x[i][j]<0){c[i][j]=0}else{c[i][j]=x[i][j]}
}}
return c
}

function a(x){
var c=[]
for(var i=0;i<x.length;i++){
var sum=0
var temp=[]
for(var j=0;j<x[i].length;i++){temp[j]=Math.exp(x[i][j]);sum=sum+temp[j]}
for(var j=0;j<x[i].length;j++){c[i][j]=temp[j]/sum}
}
return c
}

function scalarTimes(x,a){
var c=[]
for(var i=0;i<a.length;i++){c[i]=[]
for(var j=0;j<a[i].length;j++){c[i][j]=x*a[i][j]}
}
return c

}

function transpose(a){
for(var i=0;i<a[0].length;i++){c[i]=[]
for(var j=0;j<a.length;j++){c[i][j]=a[j][i]}
}
return c
}



function positionEncode(X,base){
var c=[]
for(var i=0;i<X.length;i++){c[i]=[]
for(var j=0;j<X[i].length;j++){
if(i%2==0)c[i][j]=X[i][j]+Math.cos(i*Math.pow(base,2*j/X[i].length) )
if(i%2==1)c[i][j]=X[i][j]+Math.sin(i*Math.pow(base, 2*j/X[i].length))
}}
return c

}
